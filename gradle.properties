# JVM args
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

# ⚠️ **这里不要写 `org.gradle.java.home`**（2026-10-25 修 CI 连续 5 次红）
#
# 原来这行写的是本机 Homebrew 路径：
#     org.gradle.java.home=/opt/homebrew/opt/openjdk@17
# 它解决的是**本机**的问题（非登录 shell 起 ./gradlew 找不到 JAVA_HOME），
# 但仓库里这个文件是要提交上去的 ⇒ CI 跑在 ubuntu-latest 上，
# 那个路径不存在 ⇒ **所有作业在 Gradle 配置期就挂**：
#
#     Value '/opt/homebrew/opt/openjdk@17' given for org.gradle.java.home
#     Gradle property is invalid (Java home supplied is invalid)
#
# 失败耗时 14~19 秒 —— 快到没人会去看日志，于是「CI 绿」这个信号
# 连续失效了 5 次推送都没人发现。
#
# ⇒ 本机路径改放**用户级** `~/.gradle/gradle.properties`
#   （Gradle 的属性优先级：命令行 > 系统属性 > 用户级 gradle.properties
#     > 项目 gradle.properties ⇒ 用户级会覆盖项目级）
#   CI 那边由 actions/setup-java@v4 设 JAVA_HOME，不需要这行。
#
# 本机那行内容（不要提交）：
#   org.gradle.java.home=/opt/homebrew/opt/openjdk@17

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
